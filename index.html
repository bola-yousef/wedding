<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>دعوة إكليل | د. إيهاب & د. مريم</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Amiri:wght@700&family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg: #0f172a;
      --gold: #c5a059;
      --gold-dark: #8c6d1f;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: radial-gradient(circle at center, #1e293b 0%, #0a0f1d 100%);
      min-height: 100vh;
      font-family: 'Tajawal', sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      overflow-x: hidden;
      padding: 20px 15px 60px;
    }

    #gate {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: #0a0f1d;
      z-index: 9999999;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 20px;
    }

    .open-btn {
      margin-top: 25px;
      padding: 15px 50px;
      background: linear-gradient(135deg, #c5a059, #8c6d1f);
      color: #000;
      font-weight: 800;
      font-size: 1.2rem;
      border: none;
      border-radius: 50px;
      cursor: pointer;
      box-shadow: 0 4px 20px rgba(197, 160, 89, 0.5);
      font-family: inherit;
    }

    #fx-canvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 1;
    }

    .main-wrap {
      position: relative;
      z-index: 10;
      width: 100%;
      max-width: 480px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .card-box {
      width: 100%;
      background: #ffffff;
      border-radius: 20px;
      padding: 8px;
      border: 1px solid rgba(197, 160, 89, 0.4);
      box-shadow: 0 20px 45px rgba(0, 0, 0, 0.6);
      margin-bottom: 20px;
    }

    .card-box img {
      width: 100%;
      height: auto;
      display: block;
      border-radius: 14px;
    }

    .timer-row {
      width: 100%;
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
      margin-bottom: 15px;
    }

    .timer-item {
      background: rgba(255, 255, 255, 0.07);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      border: 1px solid rgba(197, 160, 89, 0.3);
      border-radius: 12px;
      padding: 10px 4px;
      text-align: center;
      color: #fff;
    }

    .timer-val {
      font-size: 1.5rem;
      font-weight: 800;
      color: #f7e7c4;
      display: block;
      line-height: 1.2;
    }

    .timer-lbl {
      font-size: 0.75rem;
      color: #94a3b8;
    }

    .btn-row {
      width: 100%;
      display: flex;
      gap: 10px;
    }

    .action-btn {
      flex: 1;
      padding: 13px;
      text-align: center;
      border-radius: 40px;
      font-weight: 700;
      font-size: 0.95rem;
      text-decoration: none;
      font-family: inherit;
    }

    .btn-gold {
      background: linear-gradient(135deg, #c5a059, #8c6d1f);
      color: #000;
    }

    .btn-trans {
      background: rgba(255, 255, 255, 0.05);
      color: #f7e7c4;
      border: 1px solid #c5a059;
    }

    /* زر الموسيقى بأيقونة SVG تدور */
    .audio-btn {
      position: fixed;
      bottom: 20px;
      left: 20px;
      width: 48px;
      height: 48px;
      background: #1e293b;
      border: 1.5px solid #c5a059;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      z-index: 1000;
      box-shadow: 0 0 15px rgba(0,0,0,0.5);
    }

    .audio-btn svg {
      width: 22px;
      height: 22px;
      fill: #f7e7c4;
    }

    .audio-btn.playing svg {
      animation: spinMusic 4s linear infinite;
    }

    @keyframes spinMusic {
      100% { transform: rotate(360deg); }
    }
  </style>
</head>
<body>

  <!-- شاشة الدخول -->
  <div id="gate">
    <div style="font-size: 2rem; color: var(--gold); margin-bottom: 8px;">✦</div>
    <div style="font-size: 1.15rem; color: #cbd5e1; letter-spacing: 2px;">دعوة لحضور صلاة الإكليل المبارك</div>
    <h1 style="font-family: 'Amiri', serif; font-size: 2.3rem; color: #ffffff; margin: 10px 0;">د. إيهاب & د. مريم</h1>
    <button class="open-btn" onclick="startInvite()">فتح الدعوة</button>
  </div>

  <canvas id="fx-canvas"></canvas>

  <audio id="audio" src="song.mp3" loop preload="auto"></audio>

  <!-- زر تشغيل وإيقاف الموسيقى -->
  <button class="audio-btn" id="audio-toggle" onclick="toggleM()" aria-label="تشغيل أو إيقاف الموسيقى">
    <svg viewBox="0 0 24 24">
      <path d="M12 3v10.55c-.59-.34-1.27-.55-2-.55-2.21 0-4 1.79-4 4s1.79 4 4 4 4-1.79 4-4V7h4V3h-6z"/>
    </svg>
  </button>

  <div class="main-wrap">
    
    <div class="card-box">
      <img id="card-img" src="card.png" onerror="this.onerror=null; this.src='White Elegant Wedding Invitation.png';" alt="دعوة إكليل د. إيهاب ود. مريم">
    </div>

    <!-- العداد التنازلي -->
    <div class="timer-row">
      <div class="timer-item"><span class="timer-val" id="d-val">00</span><span class="timer-lbl">أيام</span></div>
      <div class="timer-item"><span class="timer-val" id="h-val">00</span><span class="timer-lbl">ساعات</span></div>
      <div class="timer-item"><span class="timer-val" id="m-val">00</span><span class="timer-lbl">دقائق</span></div>
      <div class="timer-item"><span class="timer-val" id="s-val">00</span><span class="timer-lbl">ثواني</span></div>
    </div>

    <!-- الأزرار -->
    <div class="btn-row">
      <a href="https://www.google.com/maps/search/%D9%82%D8%A7%D8%B9%D8%A9+%D9%82%D8%B5%D8%B1+%D9%85%D9%8A%D8%B1%D8%A7%D8%AC+%D9%82%D9%86%D8%A7+%D8%A7%D9%84%D8%AC%D8%AF%D9%8A%D8%AF%D8%A9" target="_blank" class="action-btn btn-gold">
        الموقع على الخريطة
      </a>
      <a href="https://www.google.com/calendar/render?action=TEMPLATE&text=%D8%A5%D9%83%D9%84%D9%8A%D9%84+%D8%AF.+%D8%A5%D9%8A%D9%87%D8%A7%D8%A8+%D9%88%D8%AF.+%D9%85%D8%B1%D9%8A%D9%85&dates=20260913T150000Z/20260913T190000Z&details=%D9%86%D8%AA%D8%B4%D8%B1%D9%81+%D8%A8%D8%AD%D8%B6%D9%88%D8%B1%D9%83%D9%85+%D8%B5%D9%84%D8%A7%D8%A9+%D8%A7%D9%84%D8%A5%D9%83%D9%84%D9%8A%D9%84&location=%D9%82%D8%A7%D8%B9%D8%A9+%D9%82%D8%B5%D8%B1+%D9%85%D9%8A%D8%B1%D8%A7%D8%AC+-+%D9%82%D9%86%D8%A7+%D8%A7%D9%84%D8%AC%D8%AF%D9%8A%D8%AF%D8%A9" target="_blank" class="action-btn btn-trans">
        إضافة إلى التقويم
      </a>
    </div>

  </div>

  <script>
    var audio = document.getElementById('audio');
    var audioBtn = document.getElementById('audio-toggle');

    function startInvite() {
      document.getElementById('gate').style.display = 'none';

      audio.play().then(function() {
        audioBtn.classList.add('playing');
        audioBtn.style.boxShadow = "0 0 15px rgba(197, 160, 89, 0.7)";
      }).catch(function() {});

      initCanvas();
    }

    function toggleM() {
      if (audio.paused) {
        audio.play();
        audioBtn.classList.add('playing');
        audioBtn.style.boxShadow = "0 0 15px rgba(197, 160, 89, 0.7)";
      } else {
        audio.pause();
        audioBtn.classList.remove('playing');
        audioBtn.style.boxShadow = "none";
      }
    }

    var canvas = document.getElementById('fx-canvas');
    var ctx = canvas.getContext('2d');
    var particles = [];

    function initCanvas() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
      particles = [];
      for (var i = 0; i < 35; i++) {
        particles.push({
          x: Math.random() * canvas.width,
          y: Math.random() * canvas.height,
          r: Math.random() * 2.2 + 0.8,
          speedY: Math.random() * 0.7 + 0.3,
          speedX: Math.random() * 0.4 - 0.2,
          alpha: Math.random() * 0.7 + 0.3
        });
      }
      render();
    }

    function render() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      ctx.fillStyle = "#c5a059";

      for (var i = 0; i < particles.length; i++) {
        var p = particles[i];
        p.y += p.speedY;
        p.x += p.speedX;

        if (p.y > canvas.height) p.y = 0;
        if (p.x > canvas.width) p.x = 0;
        if (p.x < 0) p.x = canvas.width;

        ctx.beginPath();
        ctx.globalAlpha = p.alpha;
        ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
        ctx.fill();
      }
      requestAnimationFrame(render);
    }

    var targetTime = new Date('2026-09-13T18:00:00+03:00').getTime();
    function tick() {
      var diff = targetTime - new Date().getTime();
      if (diff > 0) {
        var d = Math.floor(diff / (1000 * 60 * 60 * 24));
        var h = Math.floor((diff % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
        var m = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));
        var s = Math.floor((diff % (1000 * 60)) / 1000);

        document.getElementById('d-val').innerText = (d < 10 ? '0' : '') + d;
        document.getElementById('h-val').innerText = (h < 10 ? '0' : '') + h;
        document.getElementById('m-val').innerText = (m < 10 ? '0' : '') + m;
        document.getElementById('s-val').innerText = (s < 10 ? '0' : '') + s;
      }
    }
    setInterval(tick, 1000);
    tick();
  </script>
</body>
</html>
